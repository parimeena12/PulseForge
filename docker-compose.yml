services:
  postgres:
    image: postgres:18
    container_name: pulseforge-postgres
    environment:
      POSTGRES_DB: pulseforge
      POSTGRES_USER: pulseforge_user
      POSTGRES_PASSWORD: pulseforge_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
